[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ignore BLE001 (blind Exception catches used defensively in AI provider fallbacks & SDK wraps)
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
